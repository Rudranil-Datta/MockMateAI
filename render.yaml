services:
  - type: web
    name: mockmateai-api-rudranil-datta
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start --workspace=server
    healthCheckPath: /ready
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: mockmateai
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_TRANSCRIPTION_MODEL
        value: gemini-3.6-flash
      - key: AI_REQUEST_TIMEOUT_MS
        value: 8000
      - key: QUESTION_CACHE_TTL_MS
        value: 60000
      - key: AI_REQUESTS_PER_USER_PER_HOUR
        value: 20
      - key: AI_REQUESTS_PER_IP_PER_HOUR
        value: 60
      - key: AI_REQUESTS_PER_DAY
        value: 200
      - key: AUTH_REQUESTS_PER_IP_PER_15_MINUTES
        value: 20
      - key: UPLOADS_PER_USER_PER_HOUR
        value: 10
      - key: UPLOADS_PER_IP_PER_HOUR
        value: 30
      - key: JSON_BODY_LIMIT_BYTES
        value: 102400
      - key: AUTH_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://mockmateai-web-rudranil-datta.onrender.com
      - key: TRUST_PROXY
        value: render
      - key: RESUME_UPLOAD_DIR
        value: /tmp/mockmateai/resumes
      - key: MAX_RESUME_SIZE_BYTES
        value: 5242880
      - key: AUDIO_UPLOAD_DIR
        value: /tmp/mockmateai/audio
      - key: MAX_AUDIO_SIZE_BYTES
        value: 5242880
      - key: MONGODB_READINESS_TIMEOUT_MS
        value: 1000

  - type: web
    name: mockmateai-web-rudranil-datta
    runtime: static
    buildCommand: npm ci && npm run build --workspace=client
    staticPublishPath: ./client/dist
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: VITE_API_BASE_URL
        value: /api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://mockmateai-api-rudranil-datta.onrender.com/api/*
      - type: rewrite
        source: /health
        destination: https://mockmateai-api-rudranil-datta.onrender.com/health
      - type: rewrite
        source: /ready
        destination: https://mockmateai-api-rudranil-datta.onrender.com/ready
      - type: rewrite
        source: /*
        destination: /index.html
